<style>

  /* Layout: one quiet left-aligned column, 620px wide, sections separated by air rather than rules.
     The only bold move is the wordmark: a large light Cormorant "SERENO" set tight against a tiny mono eyebrow. */
  :root {
    --bg: #f6f6f4;
    --fg: #1c1d21;
    --muted: #6d6f78;
    --line: #dcdcd8;
    --accent: #8b2635;
    --hl: #f1e2b3;
    --display: "Cormorant Garamond", "Noto Serif KR", Georgia, serif;
    --body: "S-CoreDream", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    --mono: "S-CoreDream", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141518; --fg: #e6e5e0; --muted: #8e9099; --line: #2b2c31; --accent: #d26a78; --hl: #4a3c17; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141518; --fg: #e6e5e0; --muted: #8e9099; --line: #2b2c31; --accent: #d26a78; --hl: #4a3c17; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    font-weight: 300;
    font-size: 16px;
    line-height: 1.85;
    -webkit-font-smoothing: antialiased;
    padding-inline: 20px;
    padding-block: 0;
  }
  a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--line); transition: border-color .2s; }
  a:hover, a:focus-visible { border-color: var(--accent); outline: none; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-color: transparent; }

  .wrap { max-width: 620px; margin: 0 auto; }

  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    padding-block: 18px 12px;
    background: var(--bg);
    border-bottom: 1px solid transparent;
    transition: border-color .25s;
  }
  header.scrolled { border-bottom-color: var(--line); }
  @media (min-width: 700px) {
    header { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 24px; row-gap: 2px; align-items: baseline; }
    .mark { grid-column: 1; grid-row: 1; }
    nav { grid-column: 2; grid-row: 1; justify-self: end; max-width: 100%; }
    .lang { grid-column: 1; grid-row: 2; }
  }
  .mark { font-family: var(--display); font-size: 20px; letter-spacing: .08em; color: var(--fg); border: 0; flex: none; }
  nav { position: relative; display: flex; gap: 16px; min-width: 0; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  nav::-webkit-scrollbar { display: none; }
  @media (max-width: 699px) { nav { -webkit-mask-image: linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 14px), transparent); mask-image: linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 14px), transparent); padding-inline: 4px; } }
  nav a {
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border: 0; white-space: nowrap;
    padding-bottom: 6px; position: relative; transition: color .2s;
  }
  nav a::after {
    content: ""; position: absolute; left: 0; bottom: 0; width: 18px; height: 1px;
    background: var(--fg); transform: scaleX(0); transform-origin: left; transition: transform .25s ease;
  }
  nav a:hover { color: var(--fg); }
  nav a.active { color: var(--fg); }
  nav a.active::after { transform: scaleX(1); }
    .lang { display: flex; align-items: baseline; gap: 8px; flex: none; }
  .lang .sep { font-size: 11px; color: var(--muted); opacity: .5; padding-bottom: 6px; }
  .lang a { border: 0; font-family: var(--body); font-weight: 300; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-bottom: 6px; }
  .lang a.active { color: var(--fg); }
  .lang a.missing { opacity: .4; }
  .lang a:hover { color: var(--fg); }
  @media (max-width: 480px) {
    body { font-size: 15px; }
    header { padding-block: 14px 10px; }
    nav { gap: 16px; }
    .auto-note { font-size: 12px; color: var(--muted); letter-spacing: .02em; margin: 0 0 24px; }
    .hero { padding-block: 56px 48px; }
    section { padding-block: 0 56px; }
  }

  .hero { padding-block: 92px 72px; }
  .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; color: var(--muted); margin: 0 0 6px; }
  h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(44px, 9vw, 68px);
    line-height: .95;
    letter-spacing: -.01em;
    margin: 0 0 10px;
    text-wrap: balance;
  }
  .tagline { font-size: 14px; letter-spacing: .12em; color: var(--muted); margin: 0 0 30px; }
  .lede { font-size: 18px; max-width: 40ch; margin: 0; }

  section { padding-block: 0 72px; }
  h2 {
    font-family: var(--mono); font-weight: 400; font-size: 12px; letter-spacing: .14em;
    color: var(--muted); text-transform: uppercase; margin: 0 0 22px;
  }
  h2::after { content: ""; display: block; width: 28px; height: 1px; background: var(--fg); opacity: .55; margin-top: 12px; }
  p { margin: 0 0 1.2em; max-width: 62ch; }
  p:last-child { margin-bottom: 0; }
  em { font-style: normal; font-weight: 400; }
  mark { background: linear-gradient(transparent 45%, var(--hl) 45%, var(--hl) 92%, transparent 92%); color: inherit; font-weight: 400; padding-inline: 2px; }

  .channels { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .channels li {
    display: grid; grid-template-columns: 9.5em 1fr; gap: 16px;
    padding-block: 14px; border-bottom: 1px solid var(--line);
  }
  .channels b { font-weight: 400; }
  .channels b a { border-bottom: 1px solid var(--line); }
  .channels b a:hover { color: var(--accent); border-color: var(--accent); }
  .channels span { color: var(--muted); min-width: 0; }
  @media (max-width: 440px) { .channels li { grid-template-columns: 1fr; gap: 2px; } }


  .plain { list-style: none; margin: 0; padding: 0; }
  .plain li { padding-block: 4px; }
  .plain .note { color: var(--muted); }

  .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .gallery figure { margin: 0; min-width: 0; }
  .gallery a { border: 0; display: block; }
  .gallery img { display: block; width: 100%; max-width: 100%; height: auto; aspect-ratio: 1 / 1; object-fit: cover; background: var(--line); }
  .gallery figcaption { font-size: 12px; color: var(--muted); margin-top: 8px; letter-spacing: .02em; }
  @media (max-width: 440px) { .gallery { grid-template-columns: repeat(2, 1fr); } }

  .posts { list-style: none; margin: 0; padding: 0; }
  .posts li {
    display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: baseline;
    padding-block: 12px; border-bottom: 1px solid var(--line);
  }
  .posts li:first-child { border-top: 1px solid var(--line); }
  .posts a { border: 0; font-weight: 400; min-width: 0; }
  .posts a:hover { color: var(--accent); }
  .posts time { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sample { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 12px; letter-spacing: .04em; }

  .contact { font-family: var(--mono); font-size: 14px; list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .contact span { color: var(--muted); display: inline-block; width: 7em; }
  .contact a { border: 0; }
  .contact a:hover { color: var(--accent); }

  footer {
    border-top: 1px solid var(--line);
    padding-block: 24px 48px;
    font-family: var(--mono); font-size: 12px; color: var(--muted);
    display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  @media (prefers-reduced-motion: no-preference) {
    .hero { animation: rise .7s ease-out both; }
    @keyframes rise { from { opacity: .001; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  }
</style>

  const scroll = document.getElementById('map-scroll');
  const old = scroll.querySelector('svg'); if (!old) return;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // state
  let id = 0;
  const walk = (n, depth, parent) => { n.id = id++; n.depth = depth; n.parent = parent; n.open = depth === 0; (n.c || []).forEach(ch => walk(ch, depth + 1, n)); };
  walk(TREE, 0, null);

  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('class', 'mindmap'); svg.setAttribute('xmlns', NS); svg.setAttribute('role', 'tree');
  const gEdges = document.createElementNS(NS, 'g'); const gNodes = document.createElementNS(NS, 'g');
  svg.append(gEdges, gNodes); old.replaceWith(svg);
  document.getElementById('hint').hidden = false;

  const textW = s => [...s].reduce((w, ch) => w + (ch.charCodeAt(0) > 0x2e7f ? FS : FS * .56), 0);
  const els = new Map(); // node id -> {g, path}

  function layout() {
    const vis = []; let row = 0;
    const place = n => {
      n.x = X0 + n.depth * COL; n.w = textW(n.l) * (n.k === 'root' ? 1.3 : 1);
      const shown = n.open ? (n.c || []) : [];
      if (shown.length) { shown.forEach(place); n.y = (shown[0].y + shown[shown.length - 1].y) / 2; }
      else { n.y = ROW * (row + .5); row++; }
      vis.push(n);
    };
    place(TREE);
    return { vis, W: Math.max(...vis.map(n => n.x + n.w + (n.c ? 16 : 0))) + 24, H: ROW * row };
  }

  function edge(p, c) {
    const x1 = p.x + p.w + PAD + (p.c ? 10 : 0), y1 = p.y, x2 = c.x - PAD, y2 = c.y, mx = (x1 + x2) / 2;
    return `M${x1.toFixed(1)} ${y1.toFixed(1)} C${mx.toFixed(1)} ${y1.toFixed(1)} ${mx.toFixed(1)} ${y2.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`;
  }

  function make(n) {
    const g = document.createElementNS(NS, 'g');
    const text = document.createElementNS(NS, 'text');
    text.setAttribute('class', 'node ' + n.k); text.textContent = n.l;
    if (n.k === 'company') {
      const a = document.createElementNS(NS, 'a'); a.setAttribute('href', n.s + '.html'); a.append(text); g.append(a);
      if (n.t) { const tk = document.createElementNS(NS, 'text'); tk.setAttribute('class', 'node ticker'); tk.setAttribute('x', (n.w + 8).toFixed(1)); tk.textContent = n.t; g.append(tk); }
    } else {
      g.append(text);
      if (n.c && n.k !== 'root') {
        const dot = document.createElementNS(NS, 'circle');
        dot.setAttribute('class', 'dot'); dot.setAttribute('r', 3); dot.setAttribute('cx', (n.w + PAD + 4).toFixed(1)); dot.setAttribute('cy', 0);
        g.append(dot);
        g.setAttribute('tabindex', '0'); g.setAttribute('role', 'treeitem');
        const toggle = () => { n.open = !n.open; render(n); };
        g.addEventListener('click', toggle);
        g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
      }
    }
    let path = null;
    if (n.parent) { path = document.createElementNS(NS, 'path'); path.setAttribute('class', 'edge'); gEdges.append(path); }
    gNodes.append(g);
    return { g, path };
  }

  let anim = null;
  function render(focus) {
    const { vis, W, H } = layout();
    const visIds = new Set(vis.map(n => n.id));
    // remove hidden nodes
    for (const [nid, el] of els) if (!visIds.has(nid)) { el.g.remove(); el.path && el.path.remove(); els.delete(nid); }
    // create new ones at their parent's position so they grow out of it
    const entering = [];
    for (const n of vis) if (!els.has(n.id)) {
      const el = make(n); els.set(n.id, el);
      n.fx = n.parent ? n.parent.px ?? n.x : n.x; n.fy = n.parent ? n.parent.py ?? n.y : n.y;
      el.g.classList.add('enter'); entering.push(el.g);
    }
    for (const n of vis) {
      if (n.c) { const d = els.get(n.id).g.querySelector('.dot'); d && d.classList.toggle('closed', !n.open); }
      els.get(n.id).g.setAttribute('aria-expanded', n.c ? String(n.open) : null);
    }
    svg.setAttribute('viewBox', `0 0 ${W.toFixed(0)} ${H}`); svg.setAttribute('width', W.toFixed(0)); svg.setAttribute('height', H);
    const from = vis.map(n => [n.fx ?? n.px ?? n.x, n.fy ?? n.py ?? n.y]);
    const t0 = performance.now();
    const step = now => {
      const k = reduce ? 1 : Math.min(1, (now - t0) / DUR), e = 1 - Math.pow(1 - k, 3);
      vis.forEach((n, i) => {
        n.px = from[i][0] + (n.x - from[i][0]) * e; n.py = from[i][1] + (n.y - from[i][1]) * e;
        els.get(n.id).g.setAttribute('transform', `translate(${n.px.toFixed(1)} ${n.py.toFixed(1)})`);
      });
      vis.forEach(n => { const el = els.get(n.id); if (el.path) el.path.setAttribute('d', edge({ ...n.parent, x: n.parent.px, y: n.parent.py }, { x: n.px, y: n.py })); });
      if (k < 1) anim = requestAnimationFrame(step); else { anim = null; vis.forEach(n => { delete n.fx; delete n.fy; }); }
    };
    if (anim) cancelAnimationFrame(anim);
    requestAnimationFrame(() => { entering.forEach(g => g.classList.remove('enter')); anim = requestAnimationFrame(step); });
    // keep an opened branch in view on narrow screens
    if (focus && focus.open && focus.c) requestAnimationFrame(() => {
      const right = focus.x + COL + 120;
      if (right > scroll.scrollLeft + scroll.clientWidth) scroll.scrollTo({ left: right - scroll.clientWidth + 20, behavior: reduce ? 'auto' : 'smooth' });
    });
  }

  const setAll = (n, v) => { if (n.c) { if (n.k !== 'root') n.open = v; n.c.forEach(ch => setAll(ch, v)); } };
  document.getElementById('expand-all').addEventListener('click', () => { setAll(TREE, true); render(); });
  document.getElementById('collapse-all').addEventListener('click', () => { setAll(TREE, false); render(); });

  // deep link: #<industry slug> opens that branch
  const want = location.hash.slice(1);
  if (want) { const find = n => (n.s === want && n.k === 'industry') ? n : (n.c || []).map(find).find(Boolean); let m = find(TREE); while (m) { m.open = true; m = m.parent; } }
  render();
})();
</script>
</body>
</html>
